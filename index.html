<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Little Mermaid Jr – St Mary Star of the Sea College</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body{
  background:radial-gradient(ellipse at 50% 0%,#0a2a4a 0%,#040d1a 70%);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  font-family:'Lato',sans-serif;
  color:#e8f4f8;
  overflow-x:hidden;
  padding:16px 8px 32px;
}

/* Bubbles */
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.bubble{
  position:absolute;bottom:-60px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,0.3),rgba(100,200,255,0.05));
  border:1px solid rgba(255,255,255,0.18);
  animation:rise linear infinite;
}
@keyframes rise{to{transform:translateY(-110vh) translateX(20px);opacity:0;}}

header{text-align:center;margin-bottom:16px;position:relative;z-index:1;}
header h1{
  font-family:'Cinzel',serif;
  font-size:clamp(14px,3.5vw,28px);
  color:#f5e06a;
  text-shadow:0 0 20px rgba(245,224,106,0.4),0 2px 8px rgba(0,0,0,0.8);
  letter-spacing:0.06em;line-height:1.2;
}
header p{
  font-size:clamp(9px,1.8vw,12px);
  color:#a8d8ea;margin-top:5px;
  letter-spacing:0.15em;text-transform:uppercase;
}

/* ── BOOK ── */
.scene{perspective:2000px;position:relative;z-index:1;}

.book-wrap{
  display:flex;align-items:stretch;
  filter:drop-shadow(0 24px 48px rgba(0,0,0,0.75));
  position:relative;
}

/* Individual page panels */
.page-panel{
  width:var(--pw);height:var(--ph);
  overflow:hidden;position:relative;
  background:#061422;flex-shrink:0;
}
.page-panel.left{border-radius:4px 0 0 4px;}
.page-panel.right{border-radius:0 4px 4px 0;}
.page-panel img{
  width:100%;height:100%;object-fit:cover;
  display:block;user-select:none;-webkit-user-drag:none;
}
/* Cover-only mode: hide left panel */
.book-wrap.cover-mode .page-panel.left{
  width:0;overflow:hidden;
}
.book-wrap.cover-mode .page-panel.right{
  border-radius:4px;
}
.book-wrap.cover-mode .spine{width:0;}

.spine{
  width:10px;height:var(--ph);
  background:linear-gradient(to right,#050c14,#1d3348,#050c14);
  flex-shrink:0;z-index:2;
}

/* Page number */
.pnum{
  position:absolute;bottom:7px;
  font-family:'Cinzel',serif;font-size:10px;
  color:rgba(255,255,255,0.4);pointer-events:none;z-index:2;
}
.page-panel.left .pnum{left:10px;}
.page-panel.right .pnum{right:10px;}

/* ── TURN OVERLAY ── */
.turn-overlay{
  position:absolute;top:0;
  width:var(--pw);height:var(--ph);
  transform-style:preserve-3d;
  transition:transform 0.65s cubic-bezier(0.645,0.045,0.355,1);
  z-index:5;pointer-events:none;
}
.turn-overlay.fwd{transform-origin:left center;left:calc(var(--pw) + 10px);}
.turn-overlay.bwd{transform-origin:right center;left:0;}
.turn-overlay.go{transform:rotateY(-180deg);}
.turn-overlay.bwd.go{transform:rotateY(180deg);}

.t-face,.t-back{
  position:absolute;inset:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  overflow:hidden;
}
.t-face{border-radius:0 4px 4px 0;}
.t-back{transform:rotateY(180deg);border-radius:4px 0 0 4px;}
.t-face img,.t-back img{width:100%;height:100%;object-fit:cover;display:block;}

/* fold shadow */
.fold-shadow{
  position:absolute;top:0;left:calc(var(--pw) + 10px);
  width:18px;height:var(--ph);
  background:linear-gradient(to right,rgba(0,0,0,0.3),transparent);
  pointer-events:none;z-index:6;opacity:0;transition:opacity 0.2s;
}
.fold-shadow.show{opacity:1;}

/* click zones */
.cz{
  position:absolute;top:0;height:100%;width:45%;
  cursor:pointer;z-index:8;background:transparent;
}
.cz.czl{left:0;}
.cz.czr{right:0;}

/* ── MOBILE: single page mode ── */
@media(max-width:600px){
  .page-panel.left,.spine{display:none;}
  .page-panel.right{border-radius:4px;width:var(--pw)!important;}
  .book-wrap{justify-content:center;}
  .turn-overlay{left:0!important;transform-origin:center center!important;}
  .fold-shadow{display:none;}
  .cz.czl{left:0;width:40%;}
  .cz.czr{right:0;width:40%;}
}

/* ── CONTROLS ── */
.controls{
  display:flex;align-items:center;gap:12px;
  margin-top:20px;position:relative;z-index:1;
  flex-wrap:wrap;justify-content:center;
}
.btn{
  background:linear-gradient(135deg,#0d3d6e,#0a2a4a);
  border:1px solid rgba(100,200,255,0.3);
  color:#a8d8ea;padding:9px 22px;border-radius:30px;
  font-family:'Cinzel',serif;font-size:clamp(10px,2vw,13px);
  letter-spacing:0.08em;cursor:pointer;
  transition:all 0.2s;box-shadow:0 4px 14px rgba(0,0,0,0.3);
  touch-action:manipulation;
}
.btn:hover:not(:disabled){
  background:linear-gradient(135deg,#1a5fa0,#0d3d6e);
  border-color:rgba(100,200,255,0.55);color:#e8f4ff;
  transform:translateY(-2px);
}
.btn:active:not(:disabled){transform:translateY(0);}
.btn:disabled{opacity:0.3;cursor:not-allowed;}
.indicator{
  font-family:'Cinzel',serif;font-size:clamp(10px,2vw,12px);
  color:#a8d8ea;min-width:120px;text-align:center;letter-spacing:0.06em;
}

/* ── THUMBNAILS ── */
.thumb-strip{
  display:flex;gap:6px;
  margin-top:16px;overflow-x:auto;
  max-width:min(95vw,680px);
  padding:6px 4px;position:relative;z-index:1;
  scrollbar-width:thin;scrollbar-color:#1a4a6e transparent;
}
.thumb-strip::-webkit-scrollbar{height:3px;}
.thumb-strip::-webkit-scrollbar-thumb{background:#1a4a6e;border-radius:2px;}
.thumb{
  flex-shrink:0;width:40px;height:57px;
  border-radius:3px;overflow:hidden;cursor:pointer;
  border:2px solid transparent;transition:all 0.18s;opacity:0.55;
}
.thumb:hover{opacity:0.85;transform:translateY(-3px);}
.thumb.active{border-color:#f5e06a;opacity:1;transform:translateY(-3px);}
.thumb img{width:100%;height:100%;object-fit:cover;}

.hint{
  margin-top:12px;font-size:10px;
  color:rgba(168,216,234,0.4);letter-spacing:0.1em;
  text-align:center;position:relative;z-index:1;
}
@media(max-width:600px){.hint{display:none;}}

/* ── SWIPE indicator dots (mobile) ── */
.swipe-dots{
  display:none;gap:6px;margin-top:12px;
  position:relative;z-index:1;
  flex-wrap:wrap;justify-content:center;max-width:200px;
}
@media(max-width:600px){.swipe-dots{display:flex;}}
.dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(168,216,234,0.25);transition:all 0.2s;cursor:pointer;
}
.dot.active{background:#f5e06a;transform:scale(1.3);}

/* ── LOADING ── */
.loading-screen{
  position:fixed;inset:0;background:#040d1a;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:100;transition:opacity 0.5s;
}
.loading-screen.done{opacity:0;pointer-events:none;}
.fish-anim{font-size:44px;animation:swim 1.4s ease-in-out infinite;}
@keyframes swim{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-12px) rotate(5deg)}}
.load-text{font-family:'Cinzel',serif;color:#f5e06a;font-size:15px;margin-top:14px;letter-spacing:0.15em;}
.load-bar-wrap{width:180px;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:10px;}
.load-bar{height:100%;background:linear-gradient(to right,#4ac9f0,#f5e06a);border-radius:2px;transition:width 0.2s;}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="fish-anim">🐠</div>
  <div class="load-text">Diving Under the Sea…</div>
  <div class="load-bar-wrap"><div class="load-bar" id="loadBar" style="width:0%"></div></div>
</div>

<div class="bubbles" id="bubbles"></div>

<header>
  <h1>Disney's The Little Mermaid Jr</h1>
  <p>St Mary Star of the Sea College · 21–23 May 2026</p>
</header>

<div class="scene">
  <div class="book-wrap cover-mode" id="bookWrap">

    <div class="page-panel left" id="leftPanel">
      <img id="leftImg" src="" alt="Left page" draggable="false">
      <span class="pnum" id="leftNum"></span>
    </div>

    <div class="spine" id="spine"></div>

    <div class="page-panel right" id="rightPanel">
      <img id="rightImg" src="" alt="Right page" draggable="false">
      <span class="pnum" id="rightNum"></span>
    </div>

    <!-- Page turn overlay -->
    <div class="turn-overlay fwd" id="turnOverlay">
      <div class="t-face"><img id="tFace" src="" alt="" draggable="false"></div>
      <div class="t-back"><img id="tBack" src="" alt="" draggable="false"></div>
    </div>
    <div class="fold-shadow" id="foldShadow"></div>

    <!-- Click zones -->
    <div class="cz czl" id="czLeft"></div>
    <div class="cz czr" id="czRight"></div>
  </div>
</div>

<div class="controls">
  <button class="btn" id="prevBtn">◀ Prev</button>
  <span class="indicator" id="indicator">Cover</span>
  <button class="btn" id="nextBtn">Next ▶</button>
</div>

<div class="thumb-strip" id="thumbStrip"></div>
<div class="swipe-dots" id="swipeDots"></div>
<p class="hint">← → arrow keys · click either side to turn</p>

<script>
// ─────────────────────────────────────────────
// PAGE MAP
// Spread 0  → cover only  (right = page 1, left = blank)
// Spread 1  → pages 2–3   (left = 2, right = 3)
// Spread 2  → pages 4–5
// ...
// Spread 8  → page 16 only (left = 16, right = blank)
// ─────────────────────────────────────────────
const TOTAL = 16;
const pages = Array.from({length:TOTAL},(_,i)=>`pages/page_${String(i+1).padStart(2,'0')}.jpg`);

function spreadPages(s) {
  if (s === 0)           return { L: 0,       R: 1 };   // cover alone on right
  if (s * 2 >= TOTAL)   return { L: TOTAL,    R: 0 };   // last page alone on left (if odd)
  return                        { L: s*2,      R: s*2+1 };
}
// 0 means "blank"
const TOTAL_SPREADS = Math.ceil((TOTAL - 1) / 2) + 1; // 9 for 16 pages

function src(p) { return p >= 1 && p <= TOTAL ? pages[p-1] : ''; }

// ── Sizing ──
function pageSize() {
  const isMobile = window.innerWidth <= 600;
  if (isMobile) {
    const w = Math.min(window.innerWidth - 24, 340);
    return { w, h: Math.round(w / 0.707) };
  }
  const maxW = Math.min((window.innerWidth - 80) / 2, 380);
  const h = Math.min(maxW / 0.707, window.innerHeight * 0.65);
  return { w: Math.round(h * 0.707), h: Math.round(h) };
}

let { w: PW, h: PH } = pageSize();
function applySize() {
  document.documentElement.style.setProperty('--pw', PW+'px');
  document.documentElement.style.setProperty('--ph', PH+'px');
}
applySize();
window.addEventListener('resize', () => {
  ({w:PW,h:PH} = pageSize()); applySize();
});

// ── State ──
let cur = 0, turning = false;

// ── DOM ──
const bookWrap    = document.getElementById('bookWrap');
const leftImg     = document.getElementById('leftImg');
const rightImg    = document.getElementById('rightImg');
const leftNum     = document.getElementById('leftNum');
const rightNum    = document.getElementById('rightNum');
const turnOverlay = document.getElementById('turnOverlay');
const tFace       = document.getElementById('tFace');
const tBack       = document.getElementById('tBack');
const foldShadow  = document.getElementById('foldShadow');
const prevBtn     = document.getElementById('prevBtn');
const nextBtn     = document.getElementById('nextBtn');
const indicator   = document.getElementById('indicator');
const thumbStrip  = document.getElementById('thumbStrip');
const swipeDots   = document.getElementById('swipeDots');

// ── Preload ──
let loaded = 0;
const loadBar = document.getElementById('loadBar');
function preload() {
  return new Promise(res => {
    pages.forEach(s => {
      const img = new Image();
      img.onload = img.onerror = () => {
        loaded++;
        loadBar.style.width = (loaded/TOTAL*100)+'%';
        if (loaded === TOTAL) res();
      };
      img.src = s;
    });
  });
}

// ── Render ──
function render(s) {
  const {L, R} = spreadPages(s);
  const isMobile = window.innerWidth <= 600;
  const isCover = s === 0;
  const isLastAlone = TOTAL % 2 === 0 && s === TOTAL_SPREADS - 1;

  // Cover mode (cover alone or last-page-alone): hide left panel
  const alone = isCover || isLastAlone;
  bookWrap.classList.toggle('cover-mode', alone && !isMobile);

  leftImg.src  = src(L);
  leftNum.textContent  = L ? L : '';
  rightImg.src = src(R);
  rightNum.textContent = R ? R : '';

  // Indicator
  if (isCover) {
    indicator.textContent = 'Cover · Page 1';
  } else if (isLastAlone) {
    indicator.textContent = `Page ${L} of ${TOTAL}`;
  } else {
    const isMob = window.innerWidth <= 600;
    // On mobile show only right page
    if (isMob) indicator.textContent = `Page ${R} of ${TOTAL}`;
    else indicator.textContent = `Pages ${L}–${R} of ${TOTAL}`;
  }

  prevBtn.disabled = s === 0;
  nextBtn.disabled = s >= TOTAL_SPREADS - 1;

  document.querySelectorAll('.thumb').forEach((t,i) => t.classList.toggle('active', i===s));
  document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i===s));
  thumbStrip.children[s]?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

// ── Turn ──
function turn(dir) {
  if (turning) return;
  const next = cur + dir;
  if (next < 0 || next >= TOTAL_SPREADS) return;
  turning = true;

  const {L:cL, R:cR} = spreadPages(cur);
  const {L:nL, R:nR} = spreadPages(next);
  const isMobile = window.innerWidth <= 600;

  if (isMobile) {
    // Simple fade swap on mobile
    rightImg.style.opacity = '0';
    setTimeout(() => {
      cur = next;
      render(cur);
      rightImg.style.opacity = '1';
      turning = false;
    }, 220);
    rightImg.style.transition = 'opacity 0.2s';
    setTimeout(() => rightImg.style.transition = '', 450);
    return;
  }

  turnOverlay.classList.remove('fwd','bwd','go');

  if (dir === 1) {
    // Forward: right page flips over to reveal next left
    tFace.src = src(cR);
    tBack.src = src(nL);
    turnOverlay.style.left = (PW + 10) + 'px';
    turnOverlay.classList.add('fwd');
    foldShadow.classList.add('show');
  } else {
    // Backward: left page flips back to reveal prev right
    tFace.src = src(cL);
    tBack.src = src(nR);
    turnOverlay.style.left = '0px';
    turnOverlay.classList.add('bwd');
    foldShadow.classList.add('show');
  }

  requestAnimationFrame(() => {
    requestAnimationFrame(() => { turnOverlay.classList.add('go'); });
  });

  setTimeout(() => {
    cur = next;
    render(cur);
    turnOverlay.classList.remove('go','fwd','bwd');
    foldShadow.classList.remove('show');
    turning = false;
  }, 670);
}

// ── Controls ──
prevBtn.addEventListener('click', () => turn(-1));
nextBtn.addEventListener('click', () => turn(1));
document.getElementById('czLeft').addEventListener('click',  () => turn(-1));
document.getElementById('czRight').addEventListener('click', () => turn(1));
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight') turn(1);
  if (e.key==='ArrowLeft')  turn(-1);
});

// ── Swipe ──
let touchStartX = 0;
document.querySelector('.scene').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
}, {passive:true});
document.querySelector('.scene').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 40) turn(dx < 0 ? 1 : -1);
}, {passive:true});

// ── Build thumbnails + dots ──
for (let s = 0; s < TOTAL_SPREADS; s++) {
  const {L, R} = spreadPages(s);
  const thumbSrc = src(R || L);

  const d = document.createElement('div');
  d.className = 'thumb';
  d.title = s===0 ? 'Cover' : `Pages ${L}–${Math.min(R,TOTAL)}`;
  d.innerHTML = `<img src="${thumbSrc}" loading="lazy" alt="">`;
  d.addEventListener('click', () => { if (!turning && s!==cur){ cur=s; render(cur); }});
  thumbStrip.appendChild(d);

  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.addEventListener('click', () => { if (!turning && s!==cur){ cur=s; render(cur); }});
  swipeDots.appendChild(dot);
}

// ── Bubbles ──
const bubCont = document.getElementById('bubbles');
for (let i = 0; i < 18; i++) {
  const b = document.createElement('div');
  b.className = 'bubble';
  const sz = 5 + Math.random()*18;
  b.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;animation-duration:${8+Math.random()*14}s;animation-delay:${Math.random()*12}s;opacity:${0.2+Math.random()*0.4};`;
  bubCont.appendChild(b);
}

// ── Init ──
preload().then(() => {
  render(0);
  const ls = document.getElementById('loadingScreen');
  ls.classList.add('done');
  setTimeout(() => ls.remove(), 600);
});
</script>
</body>
</html>
